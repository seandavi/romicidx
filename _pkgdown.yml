url: https://seandavi.github.io/romicidx/
template:
  bootstrap: 5
  bslib: 
    bootswatch: materia
    pkgdown-nav-height: 85px
  includes:
    in_header: |
      <!-- Google tag (gtag.js), skipped on non-production hosts -->
      <script>
        (function() {
          var h = location.hostname;
          if (h === 'localhost' || h === '127.0.0.1' || /\.(workers\.dev|netlify\.app|ts\.net)$/.test(h) || /^[0-9.]+$/.test(h) || h.indexOf(':') !== -1) return;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KLLV1GCF4E';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){dataLayer.push(arguments);};
          gtag('js', new Date());
          gtag('config', 'G-KLLV1GCF4E', { content_group: 'romicidx' });
        })();
      </script>

navbar:
  structure:
    right: [search, github]